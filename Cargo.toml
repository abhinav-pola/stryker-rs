[workspace]
resolver = "2"
members = [
    "crates/stryker-core",
    "crates/stryker-instrumenter",
    "crates/stryker-runners",
    "crates/stryker-reporters",
    "crates/stryker-incremental",
    "crates/stryker-cli",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/abhinav-pola/stryker-rs"
rust-version = "1.98"

[workspace.dependencies]
# oxc: lockstep pin — upgrade all together in a dedicated PR gated by the corpus round-trip test
oxc_allocator = "=0.148.0"
oxc_ast = "=0.148.0"
oxc_ast_visit = "=0.148.0"
oxc_codegen = "=0.148.0"
oxc_diagnostics = "=0.148.0"
oxc_parser = "=0.148.0"
oxc_semantic = "=0.148.0"
oxc_span = "=0.148.0"
oxc_syntax = "=0.148.0"
oxc_traverse = "=0.148.0"

anyhow = "1"
async-trait = "0.1"
camino = { version = "1", features = ["serde1"] }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
globset = "0.4"
ignore = "0.4"
indicatif = "0.18"
jsonc-parser = { version = "0.33", features = ["serde"] }
libc = "0.2"
miette = { version = "7", features = ["fancy"] }
quick-xml = "0.38"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
shell-words = "1"
similar = "3"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# intra-workspace
stryker-core = { path = "crates/stryker-core" }
stryker-instrumenter = { path = "crates/stryker-instrumenter" }
stryker-runners = { path = "crates/stryker-runners" }
stryker-reporters = { path = "crates/stryker-reporters" }
stryker-incremental = { path = "crates/stryker-incremental" }

# dev
assert_cmd = "2"
insta = { version = "1", features = ["json", "redactions"] }
jsonschema = "0.33"
predicates = "3"

[profile.release]
lto = "thin"
